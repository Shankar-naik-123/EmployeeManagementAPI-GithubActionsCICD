name: "employee-cd"
on:
  workflow_run:
    workflows:
      - "employee-ci"
    types:
      - completed
    branches:
      - master

jobs:
  deploy-dev:
    name: deploy to development
    if: "${{github.event.workflow_run.conclusion=='success'}}"
    uses: ./.github/workflows/deploy.yml
    with:
      environment: Dev
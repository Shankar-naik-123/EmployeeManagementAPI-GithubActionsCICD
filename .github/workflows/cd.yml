name: "employee-cd"
on:
  workflow_run:
    workflows:
      - "employee-ci"
    types:
      - completed
    branches:
      - master

jobs:
  deploy-dev:
    name: deploy to development
    if: "${{github.event.workflow_run.conclusion=='success'}}"
    permissions:
      actions: read
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: Dev
    
  deploy-qa:
    needs: deploy-dev
    name: deploy to QA
    permissions:
      actions: read
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: QA      
    
   
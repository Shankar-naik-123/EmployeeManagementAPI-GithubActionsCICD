on:
  push:
    branches:
      - master

name: "employee-ci"
env:
  dotnet-version: '8.0.x'
  build-configuration: 'Release'
jobs:
  Build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Install dotnet sdk
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{env.dotnet-version}}
          cache: true
      - name: checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - name: Restore packages
        run: dotnet restore
          
      - name: build solution
        run: dotnet build --no-restore --configuration ${{env.build-configuration}}
          
      - name: Test the solution
        run: |
          dotnet test \
          --no-build \
          --configuration ${{env.build-configuration}} \
          --collect:"XPlat Code Coverage" \
          --logger 'trx' \
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with: 
          name: test-results
          path: "**/*.trx"
            
      - name: publish  the coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: "**/coverage.opencover.xml"      
          
      - name: publish project
        run: dotnet publish --no-build --configuration ${{env.build-configuration}} --output ./publish
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: employee-api
          path: ./publish
